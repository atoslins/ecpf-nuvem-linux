[package]
name = "certisign-nuvemd"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "certisign-nuvemd"
path = "src/main.rs"

[dependencies]
certisign-nuvem-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
toml = "0.8"
rpassword = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rsa = "0.9"
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
sha1 = { version = "0.10", features = ["oid"] }
